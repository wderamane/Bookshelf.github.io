<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ma Bibliothèque PDF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --accent: #f97316;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --header-h: 52px;
      --bottom-bar-h: 90px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    .viewer-header {
      height: var(--header-h);
      padding: 0 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 10px;
    }

    .viewer-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn {
      padding: 6px 14px;
      background: var(--accent);
      color: white;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
    }

    /* ===== LAYOUT ===== */
    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ===== SIDEBAR DESKTOP ===== */
    .sidebar {
      width: 160px;
      background: var(--bg2);
      border-right: 1px solid #334155;
      padding: 16px 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .sidebar-subtitle { font-size: 0.75rem; color: var(--muted); margin-bottom: 16px; }

    .book-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .book-card:hover { transform: scale(1.03); box-shadow: 0 4px 18px rgba(0,0,0,0.4); }
    .book-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .book-cover { width: 100%; aspect-ratio: 2/3; border-radius: 6px; object-fit: cover; display: block; }
    .book-name { font-size: 0.85rem; font-weight: 600; margin-top: 8px; line-height: 1.3; }
    .book-author { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    /* ===== VIEWER ZONE ===== */
    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      overflow: hidden;
    }

    .placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1rem;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    .placeholder span { font-size: 2.5rem; }

    #pdfFrame {
      flex: 1;
      width: 100%;
      border: none;
      display: none;
      background: white;
    }

    /* ===== BOTTOM BAR MOBILE ===== */
    .bottom-bar {
      display: none;
      height: var(--bottom-bar-h);
      background: var(--bg2);
      border-top: 1px solid #334155;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-shrink: 0;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
    }

    .bottom-bar::-webkit-scrollbar { display: none; }

    .bottom-book {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      padding: 6px;
      border-radius: 10px;
      border: 2px solid transparent;
      text-decoration: none;
    }

    .bottom-book:active { border-color: var(--accent); }

    .bottom-cover { width: 44px; height: 62px; border-radius: 5px; object-fit: cover; }

    .bottom-name {
      font-size: 0.62rem;
      color: var(--text);
      text-align: center;
      max-width: 64px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .bottom-bar { display: flex; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="viewer-header">
    <div class="viewer-title" id="viewerTitle">Aucun livre ouvert</div>
    <a class="btn" id="downloadBtn" style="display:none;">Télécharger</a>
  </header>

  <div class="layout">

    <!-- SIDEBAR DESKTOP -->
    <aside class="sidebar">
      <div class="sidebar-title">Ma bibliothèque</div>
      <div class="sidebar-subtitle">1 livre</div>

      <div class="book-card" id="card-0" onclick="openBook('pdf/Void_Project.pdf', 'Void Project – Tome I', 0)">
        <img src="img/VoidProject.png" class="book-cover" alt="Void Project">
        <div class="book-name">Void Project – Tome I</div>
        <div class="book-author">Deramane Waren</div>
      </div>
    </aside>

    <!-- VIEWER -->
    <main class="viewer">
      <div class="placeholder" id="placeholder">
        <span>📚</span>
        Sélectionne un livre pour commencer
      </div>
      <iframe id="pdfFrame"></iframe>
    </main>

  </div>

  <!-- BOTTOM BAR MOBILE : ouvre dans un nouvel onglet -->
  <nav class="bottom-bar">
    <a class="bottom-book" href="pdf/Void_Project.pdf" target="_blank" rel="noopener">
      <img src="img/VoidProject.png" class="bottom-cover" alt="Void Project">
      <div class="bottom-name">Void Project</div>
    </a>
  </nav>

  <script>
    let currentIndex = null;

    function openBook(path, title, index) {
      // Activer la carte
      if (currentIndex !== null) {
        document.getElementById("card-" + currentIndex)?.classList.remove("active");
      }
      currentIndex = index;
      document.getElementById("card-" + index)?.classList.add("active");

      // Header
      document.getElementById("viewerTitle").textContent = title;
      const dlBtn = document.getElementById("downloadBtn");
      dlBtn.style.display = "inline-block";
      dlBtn.href = path;
      dlBtn.download = title.replace(/\s+/g, "_") + ".pdf";

      // URL absolue pour Google Docs Viewer
      const absoluteUrl = new URL(path, window.location.href).href;
      const googleUrl = "https://docs.google.com/viewer?url=" + encodeURIComponent(absoluteUrl) + "&embedded=true";

      const frame = document.getElementById("pdfFrame");
      frame.src = googleUrl;
      frame.style.display = "block";
      document.getElementById("placeholder").style.display = "none";
    }
  </script>

</body>
</html>
