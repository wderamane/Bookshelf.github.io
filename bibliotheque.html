<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ma Bibliothèque PDF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --accent: #f97316;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --header-h: 52px;
      --toolbar-h: 48px;
      --bottom-bar-h: 90px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    .viewer-header {
      height: var(--header-h);
      padding: 0 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
      gap: 10px;
    }

    .viewer-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn {
      padding: 6px 14px;
      background: var(--accent);
      color: white;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
    }

    /* ===== LAYOUT ===== */
    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ===== SIDEBAR DESKTOP ===== */
    .sidebar {
      width: 160px;
      background: var(--bg2);
      border-right: 1px solid #334155;
      padding: 16px 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .sidebar-subtitle { font-size: 0.75rem; color: var(--muted); margin-bottom: 16px; }

    .book-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .book-card:hover { transform: scale(1.03); box-shadow: 0 4px 18px rgba(0,0,0,0.4); }
    .book-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .book-cover { width: 100%; aspect-ratio: 2/3; border-radius: 6px; object-fit: cover; display: block; }
    .book-name { font-size: 0.85rem; font-weight: 600; margin-top: 8px; line-height: 1.3; }
    .book-author { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    /* ===== VIEWER ZONE ===== */
    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      overflow: hidden;
    }

    /* Toolbar pagination */
    .pdf-toolbar {
      height: var(--toolbar-h);
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .pdf-toolbar.visible { display: flex; }

    .nav-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: #334155; }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }

    .page-info { font-size: 0.85rem; color: var(--muted); min-width: 80px; text-align: center; }

    /* Canvas container */
    .canvas-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
    }

    #pdfCanvas {
      display: none;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      border-radius: 4px;
      max-width: 100%;
    }

    .placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1rem;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    .placeholder span { font-size: 2.5rem; }

    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 40px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #334155;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== BOTTOM BAR MOBILE ===== */
    .bottom-bar {
      display: none;
      height: var(--bottom-bar-h);
      background: var(--bg2);
      border-top: 1px solid #334155;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-shrink: 0;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
    }

    .bottom-bar::-webkit-scrollbar { display: none; }

    .bottom-book {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 6px;
      border-radius: 10px;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .bottom-book.active { border-color: var(--accent); }

    .bottom-cover { width: 44px; height: 62px; border-radius: 5px; object-fit: cover; }

    .bottom-name {
      font-size: 0.62rem;
      color: var(--text);
      text-align: center;
      max-width: 64px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .bottom-bar { display: flex; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="viewer-header">
    <div class="viewer-title" id="viewerTitle">Aucun livre ouvert</div>
    <a class="btn" id="downloadBtn" style="display:none;">Télécharger</a>
  </header>

  <div class="layout">

    <!-- SIDEBAR DESKTOP -->
    <aside class="sidebar">
      <div class="sidebar-title">Ma bibliothèque</div>
      <div class="sidebar-subtitle">1 livre</div>

      <div class="book-card" id="card-0" onclick="openBook('pdf/Void_Project.pdf', 'Void Project – Tome I', 0)">
        <img src="img/VoidProject.png" class="book-cover" alt="Void Project">
        <div class="book-name">Void Project – Tome I</div>
        <div class="book-author">Deramane Waren</div>
      </div>
    </aside>

    <!-- VIEWER -->
    <main class="viewer">

      <div class="pdf-toolbar" id="pdfToolbar">
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>← Préc.</button>
        <span class="page-info" id="pageInfo">Page 1 / 1</span>
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)" disabled>Suiv. →</button>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <div class="placeholder" id="placeholder">
          <span>📚</span>
          Sélectionne un livre pour commencer
        </div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          Chargement du PDF…
        </div>
        <canvas id="pdfCanvas"></canvas>
      </div>

    </main>
  </div>

  <!-- BOTTOM BAR MOBILE -->
  <nav class="bottom-bar">
    <div class="bottom-book" id="mob-0" onclick="openBook('pdf/Void_Project.pdf', 'Void Project – Tome I', 0)">
      <img src="img/VoidProject.png" class="bottom-cover" alt="Void Project">
      <div class="bottom-name">Void Project</div>
    </div>
  </nav>

  <!-- PDF.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let currentIndex = null;
    let rendering = false;

    async function openBook(path, title, index) {
      if (currentIndex !== null) {
        document.getElementById("card-" + currentIndex)?.classList.remove("active");
        document.getElementById("mob-" + currentIndex)?.classList.remove("active");
      }
      currentIndex = index;
      document.getElementById("card-" + index)?.classList.add("active");
      document.getElementById("mob-" + index)?.classList.add("active");

      document.getElementById("viewerTitle").textContent = title;
      const dlBtn = document.getElementById("downloadBtn");
      dlBtn.style.display = "inline-block";
      dlBtn.href = path;
      dlBtn.download = title.replace(/\s+/g, "_") + ".pdf";

      document.getElementById("placeholder").style.display = "none";
      document.getElementById("pdfCanvas").style.display = "none";
      document.getElementById("loading").style.display = "flex";
      document.getElementById("pdfToolbar").classList.remove("visible");

      try {
        pdfDoc = await pdfjsLib.getDocument(path).promise;
        totalPages = pdfDoc.numPages;
        currentPage = 1;

        document.getElementById("loading").style.display = "none";
        document.getElementById("pdfCanvas").style.display = "block";
        document.getElementById("pdfToolbar").classList.add("visible");

        renderPage(currentPage);
      } catch (e) {
        document.getElementById("loading").style.display = "none";
        const ph = document.getElementById("placeholder");
        ph.style.display = "flex";
        ph.innerHTML = '<span>❌</span>Impossible de charger le PDF.<br><small>Vérifiez que le fichier est bien dans <code>pdf/</code></small>';
        console.error(e);
      }
    }

    async function renderPage(num) {
      if (rendering) return;
      rendering = true;

      const page = await pdfDoc.getPage(num);
      const canvas = document.getElementById("pdfCanvas");
      const container = document.getElementById("canvasContainer");

      const containerWidth = container.clientWidth - 32;
      const viewport = page.getViewport({ scale: 1 });
      const scale = Math.min(containerWidth / viewport.width, 2.0);
      const scaledViewport = page.getViewport({ scale });

      canvas.width = scaledViewport.width;
      canvas.height = scaledViewport.height;

      await page.render({
        canvasContext: canvas.getContext("2d"),
        viewport: scaledViewport
      }).promise;

      rendering = false;

      document.getElementById("pageInfo").textContent = `Page ${num} / ${totalPages}`;
      document.getElementById("prevBtn").disabled = num <= 1;
      document.getElementById("nextBtn").disabled = num >= totalPages;
      container.scrollTop = 0;
    }

    function changePage(delta) {
      const next = currentPage + delta;
      if (next < 1 || next > totalPages) return;
      currentPage = next;
      renderPage(currentPage);
    }

    // Navigation clavier
    document.addEventListener("keydown", (e) => {
      if (!pdfDoc) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") changePage(1);
      if (e.key === "ArrowLeft" || e.key === "ArrowUp") changePage(-1);
    });
  </script>

</body>
</html>
